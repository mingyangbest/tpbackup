name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 语法编译检查
        run: |
          # 以前是硬编码文件清单，v0.2.0 漏了 app/orphans.py（pyflakes 覆盖了，
          # 但编译这一步没编过它）。改成扫目录，新加的文件自动纳入。
          python -m compileall -q app tools push.py fetch.py taskstat.py
      - name: pyflakes 静态检查
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m pyflakes app/ tests/ push.py fetch.py taskstat.py tools/
      - name: 纯函数单测
        run: |
          # 单测要 import app.engine（cryptography），所以运行时依赖也装上。
          # 只覆盖不需要云盘/服务的逻辑：part_count / excludes / within / empty。
          python -m pip install -q -r requirements.txt
          python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -t tpbackup:ci .
